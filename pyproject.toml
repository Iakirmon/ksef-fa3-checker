[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fa3check"
version = "0.1.0"
description = "Walidator faktury ustrukturyzowanej FA(3) z warstwą webową"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Iakirmon" }]
dependencies = [
    "lxml==6.1.1",
    "fastapi==0.141.1",
    "uvicorn==0.35.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
    "lxml-stubs>=0.5",
]

[project.scripts]
fa3check = "fa3check.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fa3check"]

[tool.hatch.build.targets.wheel.force-include]
"src/fa3check/reguly" = "fa3check/reguly"
"src/fa3check/tlumaczenia" = "fa3check/tlumaczenia"
"src/fa3check/web/szablony" = "fa3check/web/szablony"
"src/fa3check/web/static" = "fa3check/web/static"

[tool.hatch.build.targets.sdist]
include = ["src/fa3check", "korpus", "docs", "scripts", "tests", "LICENSE", "AGENTS.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["korpus", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.coverage.run]
branch = false
source = ["fa3check"]
omit = ["*/web/szablony/*"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
